<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas e Menus com HTML e CSS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background:red;
            display: flex;
            align-items: center;
        }

        nav a{
            color: #fff;
            text-decoration: none;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: red;
            padding: 10px 20px;
            display: block;
            text-transform: uppercase;
        }
        nav a:hover{
            background: rgba(0, 0, 0, 0.3);
        }
        nav ul{
            display: flex;
            list-style: none;
            margin: 0 0 0 10px;
        }
    </style>
</head>
<body>
    <aside>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Produtos</a></li>
                
            </ul>
        </nav>
    </aside>

    <main>
       <p style="display: flex;">
        Basicamente essa aula foi um tutorial de 
        como utilizar listas para fazer um menu ou uma 
        navbar.
       </p>
</body>
</html>
