<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pensando em HTML e CSS</title>

    <style>
    *{
        margin: 0;
        padding: 0;
    }

    body{
        background-image: url(https://assets.nflxext.com/ffe/siteui/vlv3/9ba9f0e2-b246-47f4-bd1f-3e84c23a5db8/web/BR-pt-20251020-TRIFECTA-perspective_f0d84136-6c83-4108-83b7-393d0f388a27_large.jpg);
        background-size: cover;
        background-position: top center;
    }

    #heading {
        background: rgba(0,0,0,0.6);
    }

    #heading div{
        width: 90%;
        display: flex;
        justify-content: space-between;
        margin: 0 auto;
    }

    #heading .h1{
        padding: 15px 0;
        font-size: 20px;
    }

    #heading a{
        color: #fff;
        text-decoration: none;
        font-family: sans-serif;
    }

    .enter-button{
        padding: 15px 5px;
        font-size: 15px;
        background-color: rgb(193,17,25);
    }
    </style>
</head>
<body>
    <header id="heading">
        <div>
        <h1 class="h1">
           <a href="#">NETFLIX</a> 
        </h1>
        <a href="#" class="enter-button">Entrar</a>
        </div>
    </header>
    
</body>
</html>
