<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdução ao CSS Box-Model</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        .section-one,
        .section-two{
            box-sizing: border-box;
        }

        .section-one{
            background-image: url(https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Altja_j%C3%B5gi_Lahemaal.jpg/330px-Altja_j%C3%B5gi_Lahemaal.jpg);
            background-position: center center;
            color: #fff;
            width: 250px;
            height: 200px;
            border-width: 10px;
            border-bottom-color: gold;
            border-top-color: orchid;
            border-left-color: orchid;
            border-right-color: orchid;
            border-style: solid;
            padding: 15px 5px;
            margin: 30px;
        }
        .section-two{
            background: cyan;
            width: 200px;
            height: 150px;
            border: 5px solid black;
            border-radius: 50px;
            padding: 15px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <section class="section-one">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Culpa id itaque commodi magnam impedit officiis ratione quas! Dolorum, ea magni, quis eos adipisci odit autem doloremque non dolores corporis accusantium.</section>
    <section class="section-two">2</section> 
</body>
</html>
